name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: The built version must match the tag
        run: |
          VERSION=$(basename "$(ls dist/*.whl | head -n1)" | cut -d- -f2)
          if [ "${VERSION}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} builds version ${VERSION}; set the version in pyproject.toml"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      # TestPyPI cannot delete, so a reused version would keep the old build and
      # the smoke job would test that instead of this one. Stop instead.
      - name: Refuse a version already on TestPyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}\n' --connect-timeout 10 --max-time 30 \
                   --retry 3 --retry-delay 2 "https://test.pypi.org/pypi/thingagent/${VERSION}/json" \
                 | tail -n1 || true)
          case "${CODE:-000}" in
            404) echo "${VERSION} is free on TestPyPI" ;;
            200) echo "::error::thingagent ${VERSION} is already on TestPyPI; tag a new version"; exit 1 ;;
            *) echo "::error::could not reach TestPyPI (HTTP ${CODE})"; exit 1 ;;
          esac
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Install the published TestPyPI artifact, not the tree, and run the quickstart
  # against it, so a broken package never reaches the PyPI gate.
  smoke:
    name: smoke (TestPyPI, Python ${{ matrix.python }})
    needs: testpypi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install from TestPyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 12); do
            pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ "thingagent==${VERSION}" && break
            echo "attempt $i: not on TestPyPI yet"; sleep 10
          done
          pip show thingagent | grep -x "Version: ${VERSION}"
      - name: Run the quickstart against the installed package
        working-directory: examples/quickstart
        run: |
          rm -rf ../../src
          thingagent check thingagent.json
          printf 'no\n' | python run.py

  pypi:
    name: publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: github release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${GITHUB_REF_NAME}"
